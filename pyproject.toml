[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "testrx-production-retriever"
version = "1.0.0"
description = "Frozen TESTRX retrieval and prompt application"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "qdrant-client==1.19.1",
  "sentence-transformers==5.7.0",
  "numpy==2.5.3",
  "pdfplumber==0.11.10",
  "pdfminer.six==20260107",
  "Pillow==12.3.0",
  "pypdfium2==5.13.0",
  "pypdf==6.18.1",
  "PyYAML==6.0.3",
  "transformers==5.17.0",
  "tokenizers==0.23.2",
  "huggingface-hub==1.31.0",
  "torch==2.14.0",
  "safetensors==0.8.0",
  "regex==2026.9.10",
  "scikit-learn==1.9.1",
  "scipy==1.18.1",
]

[tool.setuptools.packages.find]
where = ["src"]
