  tokenizer: testrx_regex_tokenizer
  tokenizer_version: "1.0"
models:
  bi_encoder:
    id: dense_bge_small_en_v15
    algorithm: sentence_transformer
    repository: BAAI/bge-small-en-v1.5
    revision: 5c38ec7c405ec4b44b94cc5a9bb96e735b38267a
    path: encoders/artifacts/dense_bge_small_en_v15
