    revision: 233902d25c440f23af6f7d6e94d2946bac0bee0a
    path: rerankers/artifacts/reranker_minilm_l6
    batch_size: 32
retrieval:
  algorithm: cosine_similarity_exact
  distance: cosine
  candidate_k: 10
  top_k: 5
  exact_search: true
vector_store:
  collection: testrx_manual_9cc50b19_h384_bge_v1
  contract_version: "1.0"
  payload_schema_version: "1.0"
  payload_fields: [record_type, chunk_id, text, metadata]
runtime:
  application_packages:
    qdrant-client: "1.19.1"
prompt:
  system: >-
    Answer the user's question using only the supplied TESTRX manual evidence.
    If the evidence does not support an answer, say so. Cite supporting pages
    using [p. N] notation.
  template: |-
    Question:
    {query}

    TESTRX manual evidence:
    {context}

    Provide a concise answer grounded in the evidence and include page citations.
freeze:
  status: frozen
  evaluation:
    evidence_source: testrx-retriever/configs/retrieval/production.md
    accepted_date: "2026-09-17"
    dataset: TESTRX golden set, 196 questions
    strict_recall_at_5: 0.949
    mean_returned_context_tokens_at_5: 715
    mean_reciprocal_rank: 0.883
  rationale: >-
    Selected as the quality/context/operational frontier. Hierarchy-384 with
    BGE and MiniLM retained strong complete-evidence retrieval at about half
    the context of the 300/30 token-window control. Candidate K=10 outperformed
    larger candidate pools after reranking; K=5 was the context/completeness
    knee.
